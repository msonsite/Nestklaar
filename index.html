<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nestklaar</title>
  <meta name="description" content="Gedeelde verhuis- en inboedelchecklist met kostenoverzicht.">
  <meta name="theme-color" content="#1F4A3D">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nestklaar">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>

<!-- Laden -->
<div class="screen boot" id="screen-boot">
  <img src="./icons/logo.svg" alt="" width="72" height="72">
</div>

<!-- App -->
<div class="screen" id="screen-app" hidden>
  <header class="topbar">
    <img src="./icons/logo.svg" alt="" width="32" height="32">
    <div class="topbar-title">
      <strong>Nestklaar</strong>
      <span id="list-name"></span>
    </div>
    <span class="sync" id="sync" aria-live="polite"></span>
    <button class="icon-btn" id="btn-settings" aria-label="Menu en delen">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M5 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg>
    </button>
  </header>

  <main class="content">
    <section class="hero" aria-label="Voortgang">
      <svg class="house" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <clipPath id="house-clip"><path d="M32 6 58 28v28a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V28Z"/></clipPath>
        </defs>
        <g clip-path="url(#house-clip)">
          <rect class="house-bg" x="0" y="0" width="64" height="64"/>
          <rect class="house-fill" id="house-fill" x="0" y="6" width="64" height="53"/>
        </g>
        <path class="house-line" d="M32 6 58 28v28a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V28Z"/>
        <path class="house-check" d="m22 38 7 7 14-15"/>
      </svg>
      <div class="hero-text">
        <div class="percent" id="percent">0%</div>
        <div class="stats" id="stats">0 van 0 afgevinkt</div>
      </div>
      <dl class="costs">
        <div><dt>Totaal</dt><dd id="cost-total">€ 0,00</dd></div>
        <div><dt>Gekocht</dt><dd id="cost-done">€ 0,00</dd></div>
        <div><dt>Nog open</dt><dd id="cost-open">€ 0,00</dd></div>
      </dl>
    </section>

    <div class="tools">
      <div class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m20 20-4.5-4.5M17 10.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z"/></svg>
        <input id="search" type="search" placeholder="Zoek een item" aria-label="Zoek een item">
      </div>
      <div class="segmented" role="radiogroup" aria-label="Toon" id="filter">
        <button role="radio" aria-checked="true" data-filter="all">Alles</button>
        <button role="radio" aria-checked="false" data-filter="todo">Te doen</button>
        <button role="radio" aria-checked="false" data-filter="done">Afgevinkt</button>
        <button role="radio" aria-checked="false" data-filter="E">Essentieel</button>
      </div>
    </div>
    <nav class="chips" id="chips" aria-label="Ruimtes"></nav>

    <div id="list" class="list"></div>

    <section class="reminders">
      <h2>Ook niet vergeten</h2>
      <ul id="reminders"></ul>
    </section>

    <p class="footnote" id="footnote"></p>
  </main>

  <button class="fab" id="btn-add" aria-label="Item toevoegen">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<!-- Item toevoegen -->
<dialog class="sheet" id="sheet-add" aria-labelledby="add-title">
  <form id="form-add" method="dialog" class="stack">
    <div class="sheet-grip" aria-hidden="true"></div>
    <h2 id="add-title">Item toevoegen</h2>
    <label for="add-name">Wat ontbreekt er?</label>
    <input id="add-name" type="text" required maxlength="120" placeholder="bv. extra vuilnisbak">
    <label for="add-category">Ruimte</label>
    <select id="add-category"></select>
    <fieldset class="prio-pick">
      <legend>Prioriteit</legend>
      <label><input type="radio" name="prio" value="E"><span>Essentieel</span></label>
      <label><input type="radio" name="prio" value="A" checked><span>Aan te raden</span></label>
      <label><input type="radio" name="prio" value="X"><span>Extra</span></label>
    </fieldset>
    <label for="add-price">Bedrag (optioneel)</label>
    <input id="add-price" type="text" inputmode="decimal" placeholder="0,00">
    <div class="sheet-actions">
      <button class="btn" type="button" data-close>Annuleren</button>
      <button class="btn btn-primary" type="submit" id="add-submit">Toevoegen</button>
    </div>
  </form>
</dialog>

<!-- Instellingen -->
<dialog class="sheet" id="sheet-settings" aria-labelledby="settings-title">
  <div class="stack">
    <div class="sheet-grip" aria-hidden="true"></div>
    <h2 id="settings-title">Menu</h2>
    <div id="settings-body"></div>
    <div class="sheet-actions">
      <button class="btn" type="button" data-close>Sluiten</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
